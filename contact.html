
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LearnHub</title>
</head>
<body>

<header>
    <h1><a href="index.html">LearnHub</a></h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main>
    <h1>Contact LearnHub Team</h1>

    <p>Have a question? Send us a message.</p>

    <section>
        <h2>Contact Form</h2>

        <form action="#" method="post">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>
            <br><br>

            <label for="message">Message:</label>
            <textarea id="message" name="message"
                      rows="6" cols="40" required></textarea>
            <br><br>

            <button type="submit">Send Message</button>

        </form>
    </section>

    <section>
        <h2>Our Contact Information</h2>

        <address>
            LearnHub Education Platform<br>
            Jaipur, Rajasthan, India<br>
            Email: <a href="mailto:info@learnhub.example">info@learnhub.example</a><br>
            Phone: <a href="tel:+911234567890">+91 1234567890</a>
        </address>
    </section>

    <section>
        <h2>Find Us</h2>
        <p>Map location:</p>
        <iframe
            src="https://www.google.com/maps?q=Jaipur&output=embed"
            title="Map showing Jaipur"
            width="400"
            height="300"
            loading="lazy">
        </iframe>
    </section>
</main>

<footer>
    <p>&copy; 2026 LearnHub</p>
</footer>

</body>
</html>
