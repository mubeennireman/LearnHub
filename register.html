
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - LearnHub</title>
</head>
<body>

<header>
    <h1><a href="index.html">LearnHub</a></h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <h1>Student Registration</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   required minlength="3" maxlength="50">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"
                   pattern="[0-9]{10}" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </fieldset>

        <fieldset>
            <legend>Account Information</legend>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   minlength="8" autocomplete="new-password" required>
            <br><br>

            <label for="photo">Profile Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
        </fieldset>

        <fieldset>
            <legend>Education and Skills</legend>

            <label for="education">Education:</label>

            <select id="education" name="education">
                <option value="">Select Education</option>
                <option value="school">School</option>
                <option value="12th">12th Pass</option>
                <option value="graduation">Graduation</option>
                <option value="postgraduation">Post Graduation</option>
            </select>

            <p>Select your skills:</p>

            <input type="checkbox" id="html" name="skills" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="css">
            <label for="css">CSS</label>

            <input type="checkbox" id="python" name="skills" value="python">
            <label for="python">Python</label>

            <br><br>

            <label for="course">Choose Course:</label>

            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="html">HTML</option>
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="learning-time">Preferred Learning Time:</label>
            <input type="time" id="learning-time" name="learning-time">
            <br><br>

            <label for="about">Tell us about yourself:</label>
            <textarea id="about" name="about" rows="5" cols="40"
                      placeholder="Write something about yourself..."></textarea>
            <br><br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions.</label>
        </fieldset>

        <button type="submit">Register</button>
        <button type="reset">Reset Form</button>

    </form>
</main>

<footer>
    <p>&copy; 2026 LearnHub</p>
</footer>

</body>
</html>
